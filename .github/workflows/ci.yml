name: "CI / Security Suite"
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Run Self-Check CLI Scan
        run: |
          node dist/cli.js scan examples/approved_transaction.json
          node dist/cli.js x402 examples/valid_x402_micropayment.json
